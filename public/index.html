<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gather - Settle your group trip</title>
<style>
  :root { --teal:#0f766e; --orange:#f97316; --pink:#ec4899; --ink:#1f2937; --bg:#fff7ef; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { background:linear-gradient(160deg,var(--orange),var(--pink) 60%,#3b6f7a); color:#fff; text-align:center; padding:48px 16px 90px; border-radius:0 0 50% 50% / 0 0 40px 40px; }
  .emoji { font-size:3.2rem; }
  h1 { margin:6px 0; font-size:3.2rem; font-weight:700; }
  header p { margin:0; font-size:1.2rem; }
  main { max-width:560px; margin:-60px auto 40px; padding:0 14px; }
  .card { background:#fff; border-radius:28px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  label { font-weight:700; font-size:1.15rem; display:block; margin-bottom:12px; }
  textarea { width:100%; height:180px; border:2px dashed var(--orange); border-radius:16px; padding:14px; font:inherit; font-size:1rem; background:#fffaf5; resize:vertical; }
  textarea:focus, button:focus-visible { outline:3px solid #fdba74; outline-offset:2px; }
  .row { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  .ghost { background:#fff; color:var(--teal); border:2px solid var(--teal); border-radius:16px; padding:12px 18px; font:inherit; font-weight:700; cursor:pointer; }
  .main { width:100%; background:var(--teal); color:#fff; border:0; border-radius:18px; padding:16px; font:inherit; font-size:1.15rem; font-weight:700; cursor:pointer; }
  .main:disabled { opacity:.65; cursor:wait; }
  #err { display:none; margin-top:12px; padding:12px; border-radius:12px; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; }
  #out { display:none; text-align:center; margin-top:26px; }
  #sum { color:#555; margin:0; }
  #total { color:var(--teal); font-size:3rem; font-weight:700; margin:0 0 14px; }
  .pay { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#fff; border-left:8px solid var(--orange); border-radius:20px; padding:14px; margin-bottom:14px; text-align:left; box-shadow:0 4px 14px rgba(0,0,0,.05); }
  .who { display:flex; align-items:center; gap:12px; min-width:0; }
  .av { width:52px; height:52px; border-radius:50%; color:#fff; font-weight:700; font-size:1.4rem; display:flex; align-items:center; justify-content:center; flex:none; }
  .pay b { font-size:1.15rem; display:block; }
  .pay small { color:#777; }
  .amt { color:var(--teal); font-weight:700; font-size:1.7rem; display:flex; align-items:center; gap:10px; }
  .done { background:#fff; border-radius:20px; padding:18px; }
</style>
</head>
<body>
<header>
  <div class="emoji">🌴✈️</div>
  <h1>Gather</h1>
  <p>The trip is over. Let's settle up.</p>
</header>
<main>
  <div class="card">
    <label for="chat">Paste your group chat</label>
    <textarea id="chat" placeholder="Ravi: I paid 1200 for the hotel, all 4 of us..."></textarea>
    <div class="row">
      <button class="ghost" id="up">📎 Upload .txt</button>
      <button class="ghost" id="sample">✨ Try sample</button>
      <input type="file" id="file" accept=".txt,text/plain" hidden>
    </div>
    <button class="main" id="go">Settle up →</button>
    <div id="err" role="alert"></div>
  </div>
  <section id="out" aria-live="polite">
    <p id="sum"></p>
    <p id="total"></p>
    <div id="list"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const SAMPLE = [
  "Ravi: I paid 1200 for the hotel, split between all 4 of us",
  "Asha: I paid 600 for the cab, split between me, Ravi and Dev",
  "Dev: I paid 2000 for dinner, all 4 of us",
  "Meera: I paid 400 for snacks, just me and Asha",
  "Ravi: I paid 900 for the boat ride, all 4 of us"
].join("\n");
const COLORS = ["#b8a22b","#2f55b8","#2f93b8","#b8892f","#8b3fb8","#2fb87a","#b83f6a"];
const colorFor = n => COLORS[[...n].reduce((s,c)=>s+c.charCodeAt(0),0) % COLORS.length];
const money = n => "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits:2});

function err(m){ $("err").textContent = m; $("err").style.display = "block"; }
function avatar(n){
  const d = document.createElement("div");
  d.className = "av"; d.style.background = colorFor(n);
  d.textContent = (n[0] || "?").toUpperCase();
  return d;
}

$("sample").onclick = () => { $("chat").value = SAMPLE; };
$("up").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (f) $("chat").value = await f.text();
};

$("go").onclick = async () => {
  $("err").style.display = "none"; $("out").style.display = "none";
  const chat = $("chat").value.trim();
  if (chat.length < 10) return err("Paste a group chat first.");
  $("go").disabled = true; $("go").textContent = "Reading the chat...";
  try {
    const r = await fetch("/api/settle", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ chat })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Something went wrong. Try again.");
    show(data);
  } catch (e) {
    err(e.message || "Could not reach the server. Try again in a minute.");
  } finally {
    $("go").disabled = false; $("go").textContent = "Settle up →";
  }
};

function show(data){
  const ex = data.expenses || [], pays = data.payments || [];
  const total = ex.reduce((s,e)=>s+(Number(e.amount)||0),0);
  $("sum").textContent = ex.length + " expenses found. Total trip spend";
  $("total").textContent = money(total);
  const list = $("list"); list.innerHTML = "";
  if (!pays.length) {
    const d = document.createElement("div"); d.className = "done";
    d.textContent = "Everyone is settled. Nobody owes anything.";
    list.appendChild(d);
  }
  pays.forEach(p => {
    const row = document.createElement("div"); row.className = "pay";
    const who = document.createElement("div"); who.className = "who";
    who.appendChild(avatar(p.from));
    const t = document.createElement("div");
    const b = document.createElement("b"); b.textContent = p.from + " pays " + p.to;
    const s = document.createElement("small"); s.textContent = "to settle up";
    t.append(b, s); who.appendChild(t);
    const amt = document.createElement("div"); amt.className = "amt";
    amt.append(money(p.amount), avatar(p.to));
    row.append(who, amt); list.appendChild(row);
  });
  $("out").style.display = "block";
  $("out").scrollIntoView({ behavior:"smooth" });
}
</script>
</body>
</html>
